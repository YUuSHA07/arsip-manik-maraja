<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Resmi & Arsip Desa Manik Maraja</title>
    
    <!-- Font: Plus Jakarta Sans untuk tipografi tegas dan modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Tailwind dengan SATU WARNA UTAMA: #74A12E -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        utama: {
                            50: '#f6f9f2',
                            100: '#e9f2df',
                            200: '#d1e4be',
                            500: '#74A12E', /* Base Color Permintaan Anda */
                            600: '#5a8022',
                            700: '#46631d',
                            900: '#23330e',
                        },
                        gelap: '#111827', // Untuk teks utama
                        abu: '#F9FAFB', // Background abu sangat terang
                    }
                }
            }
        }
    </script>

    <style>
        .banner-fade {
            transition: opacity 0.7s ease-in-out;
        }
        /* Memastikan tidak ada horizontal scroll */
        body {
            overflow-x: hidden;
        }
    </style>
</head>
<body class="bg-abu text-gelap flex flex-col min-h-screen w-full m-0 p-0">

    <div id="header-container" class="w-full z-50"></div>

    <main class="flex-grow w-full">

        <!-- HERO SLIDER SECTION -->
        <section class="w-full">
            <div class="relative w-full h-[85vh] md:h-[calc(100vh-68px)] overflow-hidden group bg-gray-900">
                <img id="banner-img" src="" alt="Banner Desa Manik Maraja" class="absolute inset-0 w-full h-full object-cover opacity-80 banner-fade">

                <div class="absolute inset-0 bg-gradient-to-t from-gelap/95 via-gelap/40 to-transparent flex flex-col justify-end p-8 md:p-16 lg:p-24 pb-16 md:pb-24">
                    <!-- Badge Tema Hijau Matcha -->
                    <span id="banner-badge" class="inline-block bg-utama-500/90 text-white text-xs md:text-sm px-4 py-1.5 rounded-full font-bold uppercase tracking-widest w-max mb-5 backdrop-blur-md shadow-lg border border-white/20">
                        Desa Manik Maraja
                    </span>
                    <h1 id="banner-title" class="text-4xl sm:text-5xl md:text-7xl font-extrabold text-white leading-tight transition-all duration-500 max-w-5xl drop-shadow-2xl">
                        Memuat Beranda...
                    </h1>
                    <p id="banner-subtitle" class="text-gray-200 text-sm md:text-xl mt-4 md:mt-6 max-w-3xl drop-shadow-md font-medium leading-relaxed">
                        ...
                    </p>
                </div>

                <button id="prev-slide" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/90 text-white hover:text-utama-600 p-4 rounded-full backdrop-blur-md transition-all opacity-0 group-hover:opacity-100 focus:outline-none shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button id="next-slide" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/90 text-white hover:text-utama-600 p-4 rounded-full backdrop-blur-md transition-all opacity-0 group-hover:opacity-100 focus:outline-none shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <div id="dots-container" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex space-x-3 z-10"></div>
            </div>
        </section>

    </main>

    <div id="footer-container"></div>

    <script>
        const bannerList = [
            {
                gambar: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1920&auto=format&fit=crop",
                badge: "Desa Manik Maraja",
                judul: "Selamat Datang di Portal Desa Manik Maraja",
                subjudul: "Pusat Pelayanan Publik, Pengelolaan Arsip Digital, dan Informasi Transparan Desa."
            },
            {
                gambar: "https://images.unsplash.com/photo-1590001155093-a3c66ab0c3ff?q=80&w=1920&auto=format&fit=crop",
                badge: "Potensi Desa",
                judul: "Mendukung Kemajuan UMKM Warga",
                subjudul: "Pemberdayaan ekonomi masyarakat melalui produk unggulan lokal khas Manik Maraja."
            },
            {
                gambar: "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=1920&auto=format&fit=crop",
                badge: "Pengabdian Masyarakat",
                judul: "Sinergi KKN Desa Manik Maraja",
                subjudul: "Mewujudkan tata kelola arsip dan pangkalan data desa berbasis digital."
            }
        ];

        let currentIndex = 0;
        let slideInterval;

        function updateSlide(index) {
            currentIndex = index;
            const data = bannerList[currentIndex];

            const imgEl = document.getElementById('banner-img');
            const badgeEl = document.getElementById('banner-badge');
            const titleEl = document.getElementById('banner-title');
            const subtitleEl = document.getElementById('banner-subtitle');

            imgEl.style.opacity = '0.2';
            setTimeout(() => {
                imgEl.src = data.gambar;
                badgeEl.innerText = data.badge;
                titleEl.innerText = data.judul;
                subtitleEl.innerText = data.subjudul;
                imgEl.style.opacity = '0.9';
            }, 300);

            renderDots();
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots-container');
            // Warna 'bg-utama-500' menggantikan 'bg-blue-500' agar titik indikator berwarna hijau matcha
            dotsContainer.innerHTML = bannerList.map((_, i) => `
                <button onclick="goToSlide(${i})" class="h-3 rounded-full transition-all duration-300 ${i === currentIndex ? 'bg-utama-500 w-10' : 'bg-white/60 hover:bg-white w-3'}"></button>
            `).join('');
        }

        function nextSlide() {
            const next = (currentIndex + 1) % bannerList.length;
            updateSlide(next);
        }

        function prevSlide() {
            const prev = (currentIndex - 1 + bannerList.length) % bannerList.length;
            updateSlide(prev);
        }

        function goToSlide(i) {
            updateSlide(i);
            resetAutoSlide();
        }

        function startAutoSlide() {
            slideInterval = setInterval(nextSlide, 6000);
        }

        function resetAutoSlide() {
            clearInterval(slideInterval);
            startAutoSlide();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateSlide(0);
            startAutoSlide();

            document.getElementById('next-slide').addEventListener('click', () => {
                nextSlide();
                resetAutoSlide();
            });

            document.getElementById('prev-slide').addEventListener('click', () => {
                prevSlide();
                resetAutoSlide();
            });
        });
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('beranda');
        document.getElementById('footer-container').innerHTML = renderFooter();
        if (typeof initHeaderEvents === 'function') {
            initHeaderEvents();
        }
    </script>
</body>
</html>
