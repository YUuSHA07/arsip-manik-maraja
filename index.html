<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Resmi & Arsip Desa Manik Maraja</title>
    
    <!-- Google Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        utama: {
                            50: '#f6f9f2',
                            100: '#e9f2df',
                            200: '#d1e4be',
                            500: '#74A12E', /* Base Color Matcha */
                            600: '#5a8022',
                            700: '#46631d',
                            900: '#23330e',
                        },
                        gelap: '#111827',
                        abu: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    
    <style>
        .banner-fade {
            transition: opacity 0.7s ease-in-out;
        }
        /* Memastikan tidak ada horizontal scroll */
        body {
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-abu text-gelap flex flex-col min-h-screen w-full m-0 p-0">

    <div id="header-container" class="w-full z-50"></div>

    <main class="flex-grow w-full">

        <section class="w-full">
            <div class="relative w-full h-[85vh] md:h-[calc(100vh-68px)] overflow-hidden group bg-gray-900">
                <img id="banner-img" src="" alt="Banner Desa Manik Maraja" class="absolute inset-0 w-full h-full object-cover opacity-80 banner-fade">

                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent flex flex-col justify-end p-8 md:p-16 lg:p-24 pb-16 md:pb-24">
                    <!-- Badge diubah menjadi warna hijau utama (#74A12E) -->
                    <span id="banner-badge" class="inline-block bg-utama-500 text-white text-xs md:text-sm px-4 py-1.5 rounded-full font-bold uppercase tracking-wider w-max mb-4 backdrop-blur-sm shadow-lg">
                        Desa Manik Maraja
                    </span>
                    <h1 id="banner-title" class="text-4xl sm:text-5xl md:text-7xl font-extrabold text-white leading-tight transition-all duration-500 max-w-5xl drop-shadow-lg">
                        Memuat Beranda...
                    </h1>
                    <p id="banner-subtitle" class="text-gray-200 text-sm md:text-xl mt-4 md:mt-6 max-w-3xl drop-shadow-md">
                        ...
                    </p>
                </div>

                <button id="prev-slide" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-utama-500 text-white p-4 rounded-full backdrop-blur-md transition-all opacity-0 group-hover:opacity-100 focus:outline-none shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button id="next-slide" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-utama-500 text-white p-4 rounded-full backdrop-blur-md transition-all opacity-0 group-hover:opacity-100 focus:outline-none shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <div id="dots-container" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex space-x-3 z-10"></div>
            </div>
        </section>

    </main>

    <div id="footer-container"></div>

<script>
        let bannerList = [];
        let currentIndex = 0;
        let slideInterval;

        // Fungsi untuk mengacak array secara random
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        async function loadUmkmBanners() {
            // Daftar lengkap foto UMKM beserta teks khusus untuk masing-masing usaha
            let umkmDataPool = [
                {
                    gambar: "./assets/img/UMKM/bibi-pangkas/bibi-pangkas1.jpg",
                    judul: "Pangkas Rambut Tradisional Bibi Pangkas",
                    subjudul: "Layanan potong rambut harian terpercaya untuk warga lokal dengan hasil rapi dan memuaskan."
                },
                {
                    gambar: "./assets/img/UMKM/dj-residence/dj-residence1.jpg",
                    judul: "Penginapan Nyaman DJ Residence",
                    subjudul: "Fasilitas akomodasi bersih dan strategis bagi pendatang serta tamu yang berkunjung ke desa."
                },
                {
                    gambar: "./assets/img/UMKM/erp-repair/erp-repair2.jpg",
                    judul: "Jasa Servis & Perbaikan Elektronik ERP Repair",
                    subjudul: "Solusi cepat dan handal untuk perbaikan berbagai peralatan elektronik rumah tangga."
                },
                {
                    gambar: "./assets/img/UMKM/jahit-dian/jahit-dian1.jpg",
                    judul: "Konveksi & Jahitan Pakaian Jahit Dian",
                    subjudul: "Menerima pembuatan pakaian, seragam, dan jasa perbaikan busana dengan jahitan berkualitas."
                },
                {
                    gambar: "./assets/img/UMKM/jaka-bengkel/jaka-bengkel1.jpg",
                    judul: "Bengkel Motor Jaka",
                    subjudul: "Layanan servis rutin, tambal ban, dan perbaikan kendaraan bermotor warga."
                },
                {
                    gambar: "./assets/img/UMKM/masif-es-kristal/masif1.jpg",
                    judul: "Pabrik Es Kristal Masif",
                    subjudul: "Penyedia kebutuhan es kristal higienis untuk warung makan, kafe, dan acara warga."
                },
                {
                    gambar: "./assets/img/UMKM/mie-balap-bang-doyok/mie-balap-bang-doyok1.jpg",
                    judul: "Kuliner Lezat Mie Balap Bang Doyok",
                    subjudul: "Nikmati kelezatan kuliner khas mie balap favorit dengan cita rasa gurih yang menggugah selera."
                },
                {
                    gambar: "./assets/img/UMKM/pangkas-sl/pangkas-sl1.jpg",
                    judul: "Barbershop & Pangkas SL",
                    subjudul: "Model potongan rambut modern dan kekinian untuk kalangan anak muda hingga dewasa."
                },
                {
                    gambar: "./assets/img/UMKM/sate-padang/sate-padang1.jpg",
                    judul: "Kuliner Malam Sate Padang",
                    subjudul: "Sate Padang berempah khas dengan kuah kental yang lezat di lidah."
                },
                {
                    gambar: "./assets/img/UMKM/wak-atik/wak-atik1.jpg",
                    judul: "Warung Harian Wak Atik",
                    subjudul: "Menyediakan berbagai kebutuhan pokok dan sembako sehari-hari bagi warga desa."
                },
                {
                    gambar: "./assets/img/UMKM/warung-bibi-pangkas/warung-bibi-pangkas1.jpg",
                    judul: "Warung Kelontong Bibi Pangkas",
                    subjudul: "Tempat berbelanja kebutuhan rumah tangga yang lengkap dan ramah di lingkungan desa."
                },
                {
                    gambar: "./assets/img/UMKM/warung-plastik/warung-plastik1.jpg",
                    judul: "Grosir Plastik & Keperluan Usaha",
                    subjudul: "Pusat pasokan kemasan plastik dan perlengkapan jualan bagi para pedagang lokal."
                }
            ];

            // Acak urutan data UMKM secara random setiap halaman direfresh
            shuffleArray(umkmDataPool);

            // Ambil 4 data teratas yang sudah diacak untuk dijadikan 4 slide berbeda
            const selectedBanners = umkmDataPool.slice(0, 4);

            bannerList = selectedBanners.map(item => ({
                gambar: item.gambar,
                badge: "Potensi UMKM Desa",
                judul: item.judul,
                subjudul: item.subjudul
            }));

            if (bannerList.length > 0) {
                updateSlide(0);
                startAutoSlide();
            }
        }

        function updateSlide(index) {
            if (bannerList.length === 0) return;
            currentIndex = index;
            const data = bannerList[currentIndex];

            const imgEl = document.getElementById('banner-img');
            const badgeEl = document.getElementById('banner-badge');
            const titleEl = document.getElementById('banner-title');
            const subtitleEl = document.getElementById('banner-subtitle');

            imgEl.style.opacity = '0.2';
            setTimeout(() => {
                imgEl.src = data.gambar;
                badgeEl.innerText = data.badge;
                titleEl.innerText = data.judul;
                subtitleEl.innerText = data.subjudul;
                imgEl.style.opacity = '0.9';
            }, 300);

            renderDots();
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = bannerList.map((_, i) => `
                <button onclick="goToSlide(${i})" class="h-3 rounded-full transition-all duration-300 ${i === currentIndex ? 'bg-utama-500 w-10' : 'bg-white/60 hover:bg-white w-3'}"></button>
            `).join('');
        }

        function nextSlide() {
            if (bannerList.length === 0) return;
            const next = (currentIndex + 1) % bannerList.length;
            updateSlide(next);
        }

        function prevSlide() {
            if (bannerList.length === 0) return;
            const prev = (currentIndex - 1 + bannerList.length) % bannerList.length;
            updateSlide(prev);
        }

        function goToSlide(i) {
            updateSlide(i);
            resetAutoSlide();
        }

        function startAutoSlide() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 6000);
        }

        function resetAutoSlide() {
            clearInterval(slideInterval);
            startAutoSlide();
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadUmkmBanners();

            document.getElementById('next-slide').addEventListener('click', () => {
                nextSlide();
                resetAutoSlide();
            });

            document.getElementById('prev-slide').addEventListener('click', () => {
                prevSlide();
                resetAutoSlide();
            });
        });
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('beranda');
        document.getElementById('footer-container').innerHTML = renderFooter();
        if (typeof initHeaderEvents === 'function') {
            initHeaderEvents();
        }
    </script>
</body>
</html>
