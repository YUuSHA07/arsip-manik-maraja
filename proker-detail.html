<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Program Kerja - Desa Manik Maraja</title>
    
    <!-- Google Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        utama: {
                            50: '#f6f9f2',
                            100: '#e9f2df',
                            200: '#d1e4be',
                            500: '#74A12E', /* Base Color Matcha */
                            600: '#5a8022',
                            700: '#46631d',
                            900: '#23330e',
                        },
                        gelap: '#111827',
                        abu: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-abu text-gelap flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6">
            <a href="galeri-kkn.html" class="inline-flex items-center text-sm font-semibold text-utama-700 hover:text-utama-800 transition bg-utama-50 px-4 py-2 rounded-lg border border-utama-200">
                ← Kembali ke Galeri KKN
            </a>
        </div>

        <div id="detail-content" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <div class="text-center py-12 text-gray-500">
                <p class="animate-pulse">Memuat data program kerja...</p>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const prokerId = urlParams.get('id');
            const container = document.getElementById('detail-content');

            if (!prokerId) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <h3 class="text-xl font-bold text-gray-700">Program Kerja Tidak Ditemukan</h3>
                        <p class="text-gray-500 text-sm mt-2">ID program kerja tidak valid atau tidak tercantum.</p>
                        <a href="galeri-kkn.html" class="inline-block mt-4 text-sm text-utama-600 font-semibold">← Kembali</a>
                    </div>
                `;
                return;
            }

            fetch('./src/data/proker.json')
                .then(res => res.json())
                .then(data => {
                    const item = data.find(p => p.id === prokerId);
                    if (!item) {
                        container.innerHTML = `
                            <div class="text-center py-12">
                                <h3 class="text-xl font-bold text-gray-700">Program Kerja Tidak Ditemukan</h3>
                                <p class="text-gray-500 text-sm mt-2">Data dengan ID "${prokerId}" tidak ada dalam sistem.</p>
                                <a href="galeri-kkn.html" class="inline-block mt-4 text-sm text-utama-600 font-semibold">← Kembali</a>
                            </div>
                        `;
                        return;
                    }

                    // Render Foto Grid
                    let fotoHtml = '';
                    if (item.foto && item.foto.length > 0) {
                        fotoHtml = `
                            <div class="mt-8 border-t pt-6">
                                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-utama-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    Dokumentasi Foto
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${item.foto.map(f => `
                                        <div class="rounded-xl overflow-hidden border border-gray-200 bg-gray-100 h-56">
                                            <img src="${f}" alt="${item.judul}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full text-gray-400 text-sm\\'>Gambar tidak ditemukan</div>'">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }

                    // Render Video Youtube Embed (Jika ada)
                    let videoHtml = '';
                    if (item.video) {
                        videoHtml = `
                            <div class="mt-8 border-t pt-6">
                                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-utama-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    Dokumentasi Video
                                </h3>
                                <div class="aspect-video w-full rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                                    <iframe class="w-full h-full" src="${item.video}" title="${item.judul}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                                </div>
                            </div>
                        `;
                    }

                    // Render Konten Utama
                    container.innerHTML = `
                        <div class="flex items-center gap-4 border-b pb-6 mb-6">
                            <div class="w-16 h-16 ${item.warna || 'bg-utama-100 text-utama-700'} rounded-2xl flex items-center justify-center flex-shrink-0">
                                ${item.ikon || '<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'}
                            </div>
                            <div>
                                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">${item.judul}</h1>
                                <div class="flex flex-wrap items-center gap-3 mt-2 text-xs text-gray-500">
                                    <span class="bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full font-medium flex items-center gap-1.5">
                                        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        ${item.tanggal}
                                    </span>
                                    <span class="bg-utama-50 text-utama-700 px-2.5 py-1 rounded-full font-medium flex items-center gap-1.5 border border-utama-200">
                                        <svg class="w-3.5 h-3.5 text-utama-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                        ${item.pelaksana}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="prose max-w-none text-gray-700 leading-relaxed">
                            <h3 class="text-lg font-bold text-gray-800 mb-2">Deskripsi Program</h3>
                            <p class="whitespace-pre-line text-sm md:text-base">${item.deskripsi}</p>
                        </div>

                        ${fotoHtml}
                        ${videoHtml}
                    `;
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div class="text-center py-10 text-red-500 text-sm">Gagal memuat data program kerja.</div>`;
                });
        });
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('kkn');
        document.getElementById('footer-container').innerHTML = renderFooter();
        initHeaderEvents();
    </script>
</body>
</html>
