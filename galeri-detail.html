<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Dokumentasi - Desa Manik Maraja</title>
    
    <!-- Google Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        utama: {
                            50: '#f6f9f2',
                            100: '#e9f2df',
                            200: '#d1e4be',
                            500: '#74A12E', /* Base Color Matcha */
                            600: '#5a8022',
                            700: '#46631d',
                            900: '#23330e',
                        },
                        gelap: '#111827',
                        abu: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-abu text-gelap flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6">
            <a href="galeri-kkn.html" class="inline-flex items-center text-sm font-semibold text-utama-700 hover:text-utama-800 transition bg-utama-50 px-4 py-2 rounded-lg border border-utama-200">
                ← Kembali ke Galeri KKN
            </a>
        </div>

        <div id="detail-content" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-6 md:p-8">
            <div class="text-center py-12 text-gray-500">
                <p class="animate-pulse">Memuat dokumentasi...</p>
            </div>
        </div>
    </main>

    <!-- Modal Pop-up untuk Perbesar Foto Profesional -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4 transition-opacity">
        <div class="relative max-w-6xl w-full max-h-[90vh] flex items-center justify-center">
            <button onclick="closeImageModal()" class="absolute -top-12 right-0 text-white bg-white/20 hover:bg-white/40 rounded-full p-2.5 transition z-10 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <img id="modalImage" src="" alt="Zoom Foto" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl">
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const galeriId = urlParams.get('id');
            const container = document.getElementById('detail-content');

            if (!galeriId) {
                container.innerHTML = `
                    <div class="p-8 text-center py-12">
                        <h3 class="text-xl font-bold text-gray-700">Dokumentasi Tidak Ditemukan</h3>
                        <p class="text-gray-500 text-sm mt-2">ID dokumentasi tidak valid.</p>
                        <a href="galeri-kkn.html" class="inline-block mt-4 text-sm text-utama-600 font-semibold">← Kembali</a>
                    </div>
                `;
                return;
            }

            fetch('./src/data/galeri.json')
                .then(res => res.json())
                .then(data => {
                    const item = data.find(g => g.id === galeriId);
                    if (!item) {
                        container.innerHTML = `
                            <div class="p-8 text-center py-12">
                                <h3 class="text-xl font-bold text-gray-700">Dokumentasi Tidak Ditemukan</h3>
                                <p class="text-gray-500 text-sm mt-2">Data dokumentasi dengan ID "${galeriId}" tidak ditemukan.</p>
                                <a href="galeri-kkn.html" class="inline-block mt-4 text-sm text-utama-600 font-semibold">← Kembali</a>
                            </div>
                        `;
                        return;
                    }

                    // Render tambahan foto grid profesional jika properti "foto" tersedia di galeri.json
                    let fotoTambahanHtml = '';
                    if (item.foto && item.foto.length > 0) {
                        fotoTambahanHtml = `
                            <div class="mt-8 border-t border-gray-100 pt-6">
                                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-utama-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    Dokumentasi Foto Tambahan
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${item.foto.map(f => `
                                        <div class="rounded-xl overflow-hidden border border-gray-100 bg-gray-50 h-56 cursor-pointer group shadow-sm hover:shadow-md transition" onclick="openImageModal('${f}')">
                                            <img src="${f}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full text-gray-400 text-sm\\'>Gambar tidak ditemukan</div>'">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }

container.innerHTML = `
    <!-- Foto Utama dengan Ukuran & Bingkai Seragam seperti Kartu Galeri -->
    <div class="w-full h-72 sm:h-96 rounded-2xl overflow-hidden mb-8 relative cursor-pointer group shadow-md bg-gray-200" onclick="openImageModal('${item.gambar}')">
        <img src="${item.gambar}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full text-gray-400 text-sm\\'>Gambar tidak ditemukan</div>'">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center text-white font-medium text-sm gap-2 backdrop-blur-[2px]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
            Klik untuk Perbesar Foto
        </div>
    </div>

                        <div class="space-y-4">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <span class="bg-utama-50 text-utama-700 border border-utama-200 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">${item.kategori || 'Dokumentasi'}</span>
                                <span class="text-xs text-gray-500 font-medium flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${item.tanggal}
                                </span>
                            </div>

                            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 tracking-tight">${item.judul}</h1>
                            
                            <div class="prose max-w-none text-gray-600 leading-relaxed text-sm md:text-base border-t border-gray-100 pt-4">
                                <p class="whitespace-pre-line">${item.deskripsi}</p>
                            </div>

                            ${fotoTambahanHtml}
                        </div>
                    `;
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div class="p-8 text-center text-red-500 text-sm">Gagal memuat data galeri dokumentasi.</div>`;
                });
        });

        // Fungsi JavaScript untuk Mengaktifkan Pop-up Modal Profesional
        function openImageModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto'; 
        }

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('imageModal');
            if (e.target === modal) {
                closeImageModal();
            }
        });
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('kkn');
        document.getElementById('footer-container').innerHTML = renderFooter();
        initHeaderEvents();
    </script>
</body>
</html>
